<!-- Emotional Quote Section -->
<section class="w-full py-20 mb-20 border-y relative overflow-hidden"
  style="background-color: var(--color-surface-container);
         border-color: rgba(212,194,194,0.2);">
  <!-- Decorative radial gradient -->
  <div class="absolute inset-0"
    style="opacity: 0.03;
           background: radial-gradient(circle at center, var(--color-primary), transparent, transparent);">
  </div>
  <!-- Content -->
  <div class="max-w-4xl mx-auto px-8 text-center relative z-10">
    <span class="material-symbols-outlined mb-6"
      style="font-size: 48px; color: var(--color-primary); opacity: 0.5;">
      format_quote
    </span>
    <p class="font-display-lg mb-12 leading-tight" style="color: var(--color-on-surface);">
      "Las flores son las palabras silenciosas de un corazón que desea ser escuchado."
    </p>
    <p class="font-label-md uppercase" style="color: var(--color-on-surface-variant); letter-spacing: 0.1em;">
      — Sara
    </p>
  </div>
</section>
