<!-- Asymmetric Image Grid / Bento Layout -->
<section class="w-full max-w-6xl mx-auto px-8 mb-20">
  <div class="grid grid-cols-1 md:grid-cols-12 gap-6">

    <!-- Large Feature (8 cols) -->
    <div class="md:col-span-8 rounded-xl overflow-hidden shadow-sm group"
      style="box-shadow: 0 2px 6px rgba(244,194,194,0.1);">
      <div class="relative overflow-hidden"
        style="height: 500px; background-color: var(--color-surface-container-low);
               border: 1px solid rgba(182,204,184,0.3);">
        <img
          alt="Close up of delicate pink peonies on a rustic wooden table"
          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-[2s] ease-in-out"
          style="opacity: 0.9;"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuDnKBzPOm0vyPnmFZAJoTtBBghKyIPIIzOkFFWSJ2wJ52dJ2Ew_G0fquFsks1NgK-CI81pedCrpOhDrWZhqvZPBG3SUn9afb69uflbjCL35Jqwp5ECDhsD2GO0-950PIILq9Jj4JZf4IkoFzM4ycU2_eD5KX423dCIb42GTOpNnINNSPHB6gnuu3UB-eLNjzWEiaFN1LfOBOFHrZ_LIiDJQFiw2NYIHaTN89r9iZxp5QFnZ99rbu8apbkOei_Jc1IkJg_vUQXp8QNQ"
        />
        <!-- Card overlay -->
        <div class="absolute bottom-6 left-6 backdrop-blur-md p-6 rounded-lg max-w-sm"
          style="background-color: rgba(255,255,255,0.8);
                 border: 1px solid rgba(212,194,194,0.3);">
          <h3 class="font-headline-md mb-1" style="color: var(--color-on-surface);">
            El Arte del Regalo
          </h3>
          <p class="font-body-md" style="color: var(--color-on-surface-variant);">
            Creemos que entregar flores es entregar una parte del alma. Cada tallo es
            seleccionado a mano con intención.
          </p>
        </div>
      </div>
    </div>

    <!-- Side Features (4 cols) -->
    <div class="md:col-span-4 flex flex-col gap-6">
      <!-- Compromiso Card -->
      <div class="flex-1 rounded-xl overflow-hidden shadow-sm p-6 flex flex-col justify-center items-center text-center relative"
        style="background-color: var(--color-surface-container-low);
               border: 1px solid rgba(182,204,184,0.3);
               box-shadow: 0 2px 6px rgba(244,194,194,0.1);">
        <!-- Decorative background icon -->
        <span class="material-symbols-outlined absolute select-none pointer-events-none"
          style="right: -16px; bottom: -16px; font-size: 120px; color: rgba(79,99,83,0.05);">
          filter_vintage
        </span>
        <h4 class="font-label-md uppercase relative z-10 mb-1"
          style="color: var(--color-primary); letter-spacing: 0.1em;">
          Compromiso
        </h4>
        <p class="font-headline-md relative z-10 mb-3"
          style="color: var(--color-on-surface);">
          Cultivo Ético
        </p>
        <p class="font-body-md relative z-10"
          style="color: var(--color-on-surface-variant);">
          Trabajamos exclusivamente con floricultores locales que respetan los ciclos
          naturales de la tierra.
        </p>
      </div>

      <!-- Detail Image -->
      <div class="rounded-xl overflow-hidden shadow-sm"
        style="height: 200px; box-shadow: 0 2px 6px rgba(244,194,194,0.1);">
        <img
          alt="Detail of hands tying a lavender ribbon around a bespoke bouquet"
          class="w-full h-full object-cover"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrTFJIiMVzY98jq5qjckjWcvgnH1uPVooYrptXy3WExLZmHeylYv_E8gPboa-df1isK1DVt4y3eS9PVQW4TstIWW3ptwApPruGJEY3VT0TgoRthRf_5kB30khCMzVAjOpkL6r6vpHZAt-B-rt5VkjEzVyVrxaG66JSrzD3bcuN2IdOeIyzTKbCc6P7frUQKPnTzbmNK4f5h_oPVABikqTGlgCtxKWOS1DyxHWjf8t_bpAWFhnhPjpglf6a4iab936E-eI3inaZzBU"
        />
      </div>
    </div>

  </div>
</section>
